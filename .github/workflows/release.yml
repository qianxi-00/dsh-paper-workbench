name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.8.1); leave empty to use v<package.json version>'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Release Gate (Ubuntu / Node 22)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PB_CI: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure isolated test data directory
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          node -e "const fs = require('node:fs'); const os = require('node:os'); const path = require('node:path'); const dir = path.join(process.env.RUNNER_TEMP_DIR || os.tmpdir(), 'pb-release-ci-' + Date.now()); fs.mkdirSync(dir, { recursive: true }); fs.appendFileSync(process.env.GITHUB_ENV, 'DSH_PAPER_WORKBENCH_DATA=' + dir + '\n');"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies (PyMuPDF)
        run: python -m pip install --upgrade pip pymupdf

      - name: Syntax check (node --check)
        run: |
          node -e "
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          function walk(dir, ext, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, ext, out);
              else if (full.endsWith(ext)) out.push(full);
            }
            return out;
          }
          const targets = [
            ...walk('lib', '.js'),
            ...walk('scripts', '.mjs'),
            'assets/app/app.js'
          ];
          for (const file of targets) {
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          }
          "

      - name: Run full test suite
        run: npm test

      - name: Run agent installer regression tests
        run: node scripts/test-install-agent.mjs

      - name: Run release safety regression tests
        run: node scripts/test-release-safety.mjs

      - name: Run JSON fallback DB engine regression
        env:
          PB_DB_ENGINE: json
        run: node scripts/test-db.mjs

  release:
    name: Build Tarball & Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            TAG="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v${VERSION}"
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "发布标签 ${TAG} 与 package.json 版本 ${VERSION} 不匹配；请使用 v${VERSION}。" >&2
            exit 1
          fi
          case "$TAG" in
            *-*) PRERELEASE="true" ;;
            *) PRERELEASE="false" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Pack release tarball & generate SHA256SUMS.txt
        id: pack
        run: |
          mkdir -p dist
          TARBALL=$(npm pack --pack-destination dist | tail -n 1 | tr -d '\r')
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum "${TARBALL}" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish to npm with provenance (when NPM_TOKEN secret is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          if (!process.env.NPM_TOKEN) {
            console.log('未配置 NPM_TOKEN，跳过 npm 发布；GitHub Release 将继续。');
            process.exit(0);
          }
          const registry = 'https://registry.npmjs.org';
          const tarball = path.resolve('dist', process.env.RELEASE_TARBALL);
          const integrity = 'sha512-' + createHash('sha512').update(fs.readFileSync(tarball)).digest('base64');
          const view = spawnSync('npm', ['view', `dsh-paper-workbench@${process.env.RELEASE_VERSION}`, 'dist.integrity', '--json', '--registry', registry], { encoding: 'utf8' });
          if (view.error) throw view.error;
          if (view.status === 0) {
            if (JSON.parse(view.stdout) !== integrity) throw new Error('npm 上已有同版本，但 dist.integrity 与本地 tgz 不一致；请核对发布产物。');
            console.log('npm 上已有相同版本和完整性，安全跳过重复发布。');
            process.exit(0);
          }
          let registryError;
          for (const text of [view.stdout, view.stderr]) {
            try { registryError = JSON.parse(text).error; } catch {}
            if (registryError) break;
          }
          if (registryError?.code !== 'E404') {
            throw new Error('查询 npm 版本失败，停止发布：' + (view.stderr || view.stdout || `exit ${view.status}`));
          }
          // npm publish 仅在 registry 明确返回 E404 后执行，不修改用户级 npm 配置。
          const configDir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'pb-npm-'));
          const userconfig = path.join(configDir, 'npmrc');
          try {
            fs.writeFileSync(userconfig, '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n', { mode: 0o600 });
            const published = spawnSync('npm', ['publish', tarball, '--access', 'public', '--provenance', '--tag', process.env.RELEASE_PRERELEASE === 'true' ? 'next' : 'latest', '--registry', registry], {
              stdio: 'inherit', env: { ...process.env, NPM_CONFIG_USERCONFIG: userconfig },
            });
            if (published.error) throw published.error;
            if (published.status !== 0) throw new Error(`npm 发布失败（退出码 ${published.status}），请检查日志后重试。`);
          } finally {
            fs.rmSync(configDir, { recursive: true, force: true });
          }
          NODE

      - name: Generate bilingual release notes
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          node -e '
          const fs = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          const tarball = process.env.RELEASE_TARBALL;
          const lines = [
            `## dsh-paper-workbench ${tag}`,
            "",
            "### Artifacts / 发布产物",
            `- Package tarball: \`${tarball}\``,
            "- Integrity checksum: `SHA256SUMS.txt` (`sha256sum -c SHA256SUMS.txt`)",
            "",
            "---",
            "",
            "### 一行命令快速安装（免 git clone · 中文）",
            "",
            "- **Windows PowerShell 5.1+ / pwsh 7**（自动适配 DSH 桌面端与 Web 端）：",
            "  ```powershell",
            "  irm https://raw.githubusercontent.com/qianxi-00/dsh-paper-workbench/main/scripts/install.ps1 | iex",
            "  ```",
            "- **macOS / Linux / Git Bash**：",
            "  ```bash",
            "  curl -fsSL https://raw.githubusercontent.com/qianxi-00/dsh-paper-workbench/main/scripts/install.sh | bash",
            "  ```",
            "- **DSH Web CLI / 插件管理页**：",
            "  ```bash",
            "  dsh plugin --profile web add github:qianxi-00/dsh-paper-workbench",
            "  ```",
            "- **AI Coding Agent 本地/自动化安装**（Claude Code / Codex / Antigravity / DSH）：",
            "  可执行上面的一行安装脚本，或在仓库目录运行 `node scripts/install-agent.mjs --dry-run --json`、`node scripts/install-agent.mjs --json` 与 `npm run doctor`（详见 `skills/install-dsh-paper-workbench/SKILL.md`）。装完重启/重载 DSH 即可生效，并在「⚙ 设置」按需配置网络代理（如 `127.0.0.1:7897`）、PaddleOCR Token、可选 PostgreSQL/MySQL 与 Obsidian Vault。",
            "",
            "---",
            "",
            "### One-Line Zero-Clone Install (English)",
            "",
            "- **Windows PowerShell 5.1+ / pwsh 7** (auto-detects DSH Desktop & Web):",
            "  ```powershell",
            "  irm https://raw.githubusercontent.com/qianxi-00/dsh-paper-workbench/main/scripts/install.ps1 | iex",
            "  ```",
            "- **macOS / Linux / Git Bash**:",
            "  ```bash",
            "  curl -fsSL https://raw.githubusercontent.com/qianxi-00/dsh-paper-workbench/main/scripts/install.sh | bash",
            "  ```",
            "- **DSH Web CLI / Plugin Manager**:",
            "  ```bash",
            "  dsh plugin --profile web add github:qianxi-00/dsh-paper-workbench",
            "  ```",
            "- **AI Coding Agent Install** (Claude Code, Codex, Antigravity, DSH):",
            "  Run the 1-line installer above or follow `skills/install-dsh-paper-workbench/SKILL.md` (`node scripts/install-agent.mjs --dry-run --json` -> `node scripts/install-agent.mjs --json` -> `npm run doctor`). Reload/restart DSH after install; optional settings include Network Proxy, PaddleOCR Token, PostgreSQL/MySQL, and Obsidian Vault.",
          ];
          fs.writeFileSync("dist/RELEASE_NOTES.md", lines.join("\n") + "\n", "utf8");
          '

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: dsh-paper-workbench ${{ steps.meta.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/${{ steps.pack.outputs.tarball }}
            dist/SHA256SUMS.txt
